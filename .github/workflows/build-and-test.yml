name: Build and Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

env:
  TZ: Europe/London

jobs:
  build_and_test:
    name: Build and Test Reporting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: bichard7-next-reporting

      - name: Checkout Core Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'ministryofjustice/bichard7-next-core'
          token: ${{ secrets.GH_PAT_TOKEN }}
          path: bichard7-next-core
          fetch-depth: 1

      - name: Setup node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: bichard7-next-reporting/.nvmrc
          cache-dependency-path: bichard7-next-reporting/package-lock.json
          
      - name: ⛓️ SLSA Supply Chain Security
        uses: ministryofjustice/devsecops-actions/sca/slsa@7dc13c20e2bf541b8a77fa1320a04983b18846f6 # v1.6.0
        with:
          security-patch-package-exclusion: '@moj-bichard7-developers/bichard7-next-data'
          
      - name: Install dependencies
        working-directory: ./bichard7-next-reporting
        run: npm ci --ignore-scripts

      - name: Run build
        working-directory: ./bichard7-next-reporting
        run: npm run build

      - name: Install core dependencies
        working-directory: ./bichard7-next-core
        run: npm ci --ignore-scripts

      - name: Run Postgres and LocalStack
        working-directory: ./bichard7-next-core
        run: |
          npm run postgres
          npm run localstack

      - name: Run test
        working-directory: ./bichard7-next-reporting
        run: npm run test
